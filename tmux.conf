# ── Prefix ────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Pane Splits ──────────────────────────────────────
# prefix + d  = vertical split   (mirrors Cmd+D)
# prefix + D  = horizontal split (mirrors Cmd+Shift+D)
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"

# ── Pane Navigation ─────────────────────────────────
# prefix + j/k = cycle panes (mirrors Cmd+J/K)
bind j select-pane -t :.+
bind k select-pane -t :.-

# prefix + h/l for left/right if you want directional
bind h select-pane -L
bind l select-pane -R

# ── Pane Close ───────────────────────────────────────
# prefix + w = close pane (mirrors Cmd+W)
bind w kill-pane

# ── Pane Resize ──────────────────────────────────────
# prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── Windows (tabs) ───────────────────────────────────
# prefix + t = new window (mirrors Cmd+T)
bind t new-window -c "#{pane_current_path}"

# prefix + 1-5 already works by default
# prefix + ] / [ = next/prev window
bind ] next-window
bind [ previous-window

# ── Scrollback ───────────────────────────────────────
# prefix + f = enter copy/search mode (mirrors Cmd+Shift+F)
bind f copy-mode

# ── Copy Mode (vi style) ────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Reload Config ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Catppuccin Mocha Status Bar ──────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-left-length 30
set -g status-right "#[fg=#585b70]│ #[fg=#cdd6f4]%H:%M "
set -g window-status-format "#[fg=#585b70] #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

